<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Pretendard;src:url('/assets/fonts-web/Pretendard-Regular.woff2')}@font-face{font-family:Pretendard;src:url('/assets/fonts-web/Pretendard-SemiBold.woff2');font-weight:600}@font-face{font-family:Pretendard;src:url('/assets/fonts-web/Pretendard-ExtraBold.woff2');font-weight:800}
*{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden}body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;background:#f8f7fc}.card{position:absolute;inset:0;display:none;padding:62px 68px;color:#17171d;background:radial-gradient(circle at 78% 18%,rgba(103,83,248,.14),transparent 260px),linear-gradient(135deg,#fff 0%,#f7f5ff 72%,#efecff 100%)}.card.active{display:block}.logo{position:relative;z-index:3;width:auto;height:54px}.copy{position:absolute;z-index:3;left:68px;bottom:68px}.kicker{margin:0 0 20px;color:#6753f8;font-size:18px;font-weight:800;letter-spacing:.16em}.copy h1{max-width:760px;margin:0;font-size:70px;line-height:1.04;letter-spacing:-.06em}.copy h1 em{color:#6753f8;font-style:normal}.copy p:last-child{margin:22px 0 0;color:#62636e;font-size:23px;font-weight:600}.mesh{position:absolute;inset:0;opacity:.72;background-image:linear-gradient(rgba(103,83,248,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(103,83,248,.055) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(90deg,transparent 30%,#000)}.orb{position:absolute;right:54px;top:48px;width:370px;height:370px;border:1px solid rgba(103,83,248,.24);border-radius:50%}.orb:before,.orb:after{content:"";position:absolute;border:1px solid rgba(103,83,248,.2);border-radius:50%}.orb:before{inset:56px}.orb:after{inset:120px;background:rgba(103,83,248,.07)}.node{position:absolute;width:18px;height:18px;background:#fff;border:5px solid #6753f8;border-radius:50%;box-shadow:0 0 0 10px rgba(103,83,248,.12)}.n1{right:333px;top:92px}.n2{right:91px;top:276px}.n3{right:282px;top:382px}
.flow-visual{position:absolute;right:46px;bottom:42px;width:470px;height:430px;border:1px solid rgba(103,83,248,.17);border-radius:28px;background:rgba(255,255,255,.66);box-shadow:0 28px 70px rgba(47,35,98,.12);overflow:hidden}.flow-visual:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(103,83,248,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(103,83,248,.07) 1px,transparent 1px);background-size:44px 44px}.zone{position:absolute;border:1px solid rgba(103,83,248,.22);border-radius:12px;background:rgba(255,255,255,.8)}.z1{left:28px;top:32px;width:170px;height:105px}.z2{right:28px;top:32px;width:170px;height:105px}.z3{left:28px;bottom:32px;width:145px;height:112px}.z4{left:190px;top:174px;width:120px;height:94px;background:#eeebff}.z5{right:28px;bottom:32px;width:145px;height:112px}.trace{position:absolute;left:92px;top:120px;width:300px;height:160px;border:7px solid #6753f8;border-top-color:transparent;border-left-color:transparent;border-radius:50%;transform:rotate(13deg)}.flow-card .copy{max-width:650px}.flow-card .copy h1{font-size:62px;max-width:650px}.flow-card .copy p:last-child{font-size:22px}
.go-visual{position:absolute;right:68px;top:80px;width:380px;height:470px}.phone{position:absolute;right:20px;top:0;width:220px;height:445px;padding:40px 24px;color:#fff;background:linear-gradient(165deg,#8069ff,#5940df);border:10px solid #20202a;border-radius:38px;box-shadow:0 32px 70px rgba(48,36,105,.22)}.phone:before{content:"";position:absolute;top:12px;left:76px;width:50px;height:10px;background:#20202a;border-radius:10px}.phone small{font-size:15px}.phone strong{position:absolute;left:24px;bottom:90px;font-size:30px;line-height:1.25}.arrow{position:absolute;right:28px;bottom:29px;width:42px;height:42px;border-top:8px solid #fff;border-right:8px solid #fff;transform:rotate(45deg)}.route{position:absolute;left:0;top:52px;width:190px;height:305px;border:8px solid #6753f8;border-right:0;border-bottom:0;border-radius:55% 0 0}.route:before,.route:after{content:"";position:absolute;width:20px;height:20px;background:#fff;border:6px solid #6753f8;border-radius:50%}.route:before{left:-14px;top:-14px}.route:after{left:-14px;bottom:-14px}.go-card .copy h1{max-width:660px;font-size:64px}
</style>
</head>
<body>
<section class="card brand-card" data-card="brand"><img class="logo" src="/assets/iruvy-logo.svg" alt=""><div class="mesh"></div><div class="orb"></div><i class="node n1"></i><i class="node n2"></i><i class="node n3"></i><div class="copy"><p class="kicker">REALITY INTELLIGENCE</p><h1>현실을<br><em>운영의 언어로</em></h1><p>사람·공간·사물의 상호작용에서 더 나은 결정까지</p></div></section>
<section class="card flow-card" data-card="flow"><img class="logo" src="/assets/iruvy-flow-logo.svg" alt=""><div class="mesh"></div><div class="flow-visual"><i class="zone z1"></i><i class="zone z2"></i><i class="zone z3"></i><i class="zone z4"></i><i class="zone z5"></i><i class="trace"></i><i class="node n1"></i><i class="node n2"></i><i class="node n3"></i></div><div class="copy"><p class="kicker">INSTITUTIONAL OPERATIONS</p><h1>기관의 실제<br><em>업무 흐름</em></h1><p>측정에서 변화까지</p></div></section>
<section class="card go-card" data-card="go"><img class="logo" src="/assets/iruvy-go-logo.svg" alt=""><div class="mesh"></div><div class="go-visual"><div class="route"></div><div class="phone"><small>목적지까지</small><strong>오른쪽으로<br>이동하세요</strong><i class="arrow"></i></div></div><div class="copy"><p class="kicker">INDOOR ACCESSIBILITY</p><h1>복잡한 실내에서<br><em>목적지까지</em></h1><p>음성·진동 중심의 실내 이동 안내</p></div></section>
<script>document.querySelector(`[data-card="${new URLSearchParams(location.search).get('card')||'brand'}"]`)?.classList.add('active')</script>
</body>
</html>
